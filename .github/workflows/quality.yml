name: LifeOS quality checks
on:
  pull_request:
  push:
    branches: [main, feature/scientific-advisor-foundation]
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  typecheck-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: placeholder
          POSTGRES_DB: lifeos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lifeos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:placeholder@localhost:5432/lifeos
      SESSION_SECRET: ci-only-long-random-not-for-production-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Prisma schema validation
        run: bunx prisma validate
      - name: Generate Prisma client
        run: bunx prisma generate
      - name: Audit API ownership
        run: node scripts/audit-api-ownership.mjs
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Build app (no DB push)
        run: bun run build
      - name: Pure logic tests
        run: bun test tests/activity-sessions.test.ts tests/account-policy.test.ts tests/request-origin.test.ts tests/eisenhower.test.ts tests/i18n.test.ts tests/scientific-advisor.test.ts tests/lifeos-analytics.test.ts tests/ui-copy.test.ts
      - name: Initialize disposable PostgreSQL schema
        run: bunx prisma db push
      - name: Two-account database isolation test
        run: bun test tests/activity-sessions.integration.test.ts
